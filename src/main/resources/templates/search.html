<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>搜索结果 - So Novel</title>
</head>
<body>
    <section>
        <!-- 搜索头部 -->
        <div class="mb-4">
            <h1 class="h3">搜索结果</h1>
            <p>
                关键词: <strong th:text="${keyword}"></strong>
                <span th:if="${sourceId != null}">
                    (书源ID: <span th:text="${sourceId}"></span>)
                </span>
            </p>
            <div class="d-flex">
                <form th:action="@{/search}" method="get" class="d-flex">
                    <input type="text" class="form-control me-2" name="keyword" th:value="${keyword}" required>
                    <input type="hidden" name="sourceId" th:value="${sourceId}" th:if="${sourceId != null}">
                    <button class="btn btn-primary" type="submit">重新搜索</button>
                </form>
            </div>
        </div>

        <!-- 搜索结果列表 -->
        <div class="row">
            <div class="col-12" th:if="${#lists.isEmpty(results)}">
                <div class="alert alert-warning">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    没有找到与 "<span th:text="${keyword}"></span>" 相关的小说。
                </div>
            </div>
            
            <!-- 有搜索结果 -->
            <div class="col-12" th:unless="${#lists.isEmpty(results)}">
                <div class="card mb-3" th:each="book : ${results}">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-2 text-center mb-3 mb-md-0">
                                <img th:src="${book.coverUrl}" th:alt="${book.title}" class="img-fluid" 
                                     style="max-height: 150px; width: auto;"
                                     onerror="this.src='/static/images/no-cover.jpg'">
                            </div>
                            <div class="col-md-10">
                                <h5 class="card-title" th:text="${book.title}"></h5>
                                <p class="card-text">
                                    <span class="badge bg-primary me-2">作者: <span th:text="${book.author}"></span></span>
                                    <span class="badge bg-secondary me-2">来源: <span th:text="${book.source}"></span></span>
                                </p>
                                <p class="card-text" th:if="${book.latestChapter}">
                                    最新章节: <span th:text="${book.latestChapter}"></span>
                                </p>
                                <p class="card-text" th:if="${book.description}">
                                    <small class="text-muted" th:text="${book.description}"></small>
                                </p>
                                <div class="mt-3">
                                    <button class="btn btn-primary btn-sm" 
                                            th:attr="data-book-id=${book.bookId},data-title=${book.title},data-author=${book.author}"
                                            data-bs-toggle="modal" data-bs-target="#downloadModal">
                                        <i class="bi bi-download me-1"></i> 下载
                                    </button>
                                    <a th:href="${book.detailUrl}" target="_blank" class="btn btn-outline-secondary btn-sm">
                                        <i class="bi bi-link-45deg me-1"></i> 详情页
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 下载模态框 -->
        <div class="modal fade" id="downloadModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">下载小说</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <p>
                                标题: <strong id="downloadTitle"></strong><br>
                                作者: <span id="downloadAuthor"></span>
                            </p>
                        </div>
                        <div class="mb-3">
                            <label for="downloadFormat" class="form-label">选择格式</label>
                            <select class="form-select" id="downloadFormat">
                                <option value="epub" selected>EPUB (推荐)</option>
                                <option value="txt">TXT</option>
                                <option value="html">HTML</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-primary" id="startDownloadBtn">开始下载</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- JavaScript -->
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                // 下载模态框处理
                const downloadModal = document.getElementById('downloadModal');
                let currentBookId = '';
                
                if (downloadModal) {
                    downloadModal.addEventListener('show.bs.modal', function(event) {
                        const button = event.relatedTarget;
                        currentBookId = button.getAttribute('data-book-id');
                        const title = button.getAttribute('data-title');
                        const author = button.getAttribute('data-author');
                        
                        document.getElementById('downloadTitle').textContent = title;
                        document.getElementById('downloadAuthor').textContent = author;
                    });
                    
                    // 下载按钮点击事件
                    document.getElementById('startDownloadBtn').addEventListener('click', function() {
                        const format = document.getElementById('downloadFormat').value;
                        startDownload(currentBookId, format);
                    });
                }
                
                // 开始下载
                function startDownload(bookId, format) {
                    // 调用API创建下载任务
                    fetch('/api/download?bookId=' + encodeURIComponent(bookId) + '&format=' + format, {
                        method: 'POST'
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.code === 0) {
                            // 下载成功，关闭模态框并跳转到下载任务页面
                            const modal = bootstrap.Modal.getInstance(downloadModal);
                            modal.hide();
                            window.location.href = '/download/' + data.data;
                        } else {
                            alert('下载失败: ' + data.message);
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('下载请求失败，请稍后重试');
                    });
                }
            });
        </script>
    </section>
</body>
</html>
