<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>下载任务 - So Novel</title>
</head>
<body>
    <section>
        <h1 class="h3 mb-4">下载任务</h1>
        
        <!-- 任务列表 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">任务列表</h5>
                <button class="btn btn-sm btn-primary" id="refreshBtn">
                    <i class="bi bi-arrow-clockwise me-1"></i> 刷新
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>书名</th>
                                <th>作者</th>
                                <th>格式</th>
                                <th>进度</th>
                                <th>状态</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="taskList">
                            <tr th:each="task : ${tasks}">
                                <td th:text="${task.taskId}"></td>
                                <td th:text="${task.title}"></td>
                                <td th:text="${task.author}"></td>
                                <td th:text="${task.format}"></td>
                                <td>
                                    <div class="progress" style="height: 20px;">
                                        <div class="progress-bar" role="progressbar" 
                                             th:style="'width: ' + ${task.progress} + '%'" 
                                             th:text="${task.progress} + '%'"></div>
                                    </div>
                                </td>
                                <td>
                                    <span th:if="${task.status == 'PENDING'}" class="badge bg-warning">等待中</span>
                                    <span th:if="${task.status == 'RUNNING'}" class="badge bg-primary">下载中</span>
                                    <span th:if="${task.status == 'COMPLETED'}" class="badge bg-success">完成</span>
                                    <span th:if="${task.status == 'FAILED'}" class="badge bg-danger">失败</span>
                                    <span th:if="${task.status == 'CANCELED'}" class="badge bg-secondary">已取消</span>
                                </td>
                                <td th:text="${#temporals.format(task.createTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/download/{id}(id=${task.taskId})}" class="btn btn-info">
                                            <i class="bi bi-info-circle"></i>
                                        </a>
                                        <a th:if="${task.status == 'COMPLETED' && task.downloadUrl != null}" 
                                           th:href="${task.downloadUrl}" 
                                           class="btn btn-success" download>
                                            <i class="bi bi-download"></i>
                                        </a>
                                        <button th:if="${task.status == 'RUNNING'}" 
                                                th:attr="data-task-id=${task.taskId}"
                                                class="btn btn-danger cancel-btn">
                                            <i class="bi bi-x-circle"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(tasks)}">
                                <td colspan="8" class="text-center">暂无下载任务</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- JavaScript -->
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                // 刷新按钮
                document.getElementById('refreshBtn').addEventListener('click', function() {
                    window.location.reload();
                });
                
                // 取消任务按钮
                document.querySelectorAll('.cancel-btn').forEach(button => {
                    button.addEventListener('click', function() {
                        const taskId = this.getAttribute('data-task-id');
                        cancelTask(taskId);
                    });
                });
                
                // 取消任务
                function cancelTask(taskId) {
                    if (confirm('确定要取消此下载任务吗？')) {
                        fetch('/api/download/' + taskId, {
                            method: 'DELETE'
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (data.code === 0 && data.data === true) {
                                alert('任务已取消');
                                window.location.reload();
                            } else {
                                alert('取消任务失败: ' + data.message);
                            }
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            alert('请求失败，请稍后重试');
                        });
                    }
                }
                
                // 自动刷新运行中的任务
                const hasRunningTasks = document.querySelectorAll('span.badge.bg-primary, span.badge.bg-warning').length > 0;
                if (hasRunningTasks) {
                    setTimeout(function() {
                        window.location.reload();
                    }, 5000); // 每5秒刷新一次
                }
            });
        </script>
    </section>
</body>
</html>
